<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Housekeeping TV Checklist</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f6f8;
    }

    header {
      background: #2c7be5;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      padding: 10px;
    }

    .room {
      background: white;
      border-radius: 10px;
      padding: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .room h3 {
      margin: 0 0 10px;
      font-size: 14px;
    }

    label {
      display: block;
      margin: 5px 0;
      font-size: 14px;
      cursor: pointer;
    }

    input[type="checkbox"] {
      transform: scale(1.4);
      margin-right: 8px;
    }

    .box-selected {
      background: #d4edda;
    }

    .normal-selected {
      background: #f8d7da;
    }
  </style>
</head>
<body>

<header>
  Housekeeping TV Type Checklist - Grand Sehati
</header>

<div class="container" id="roomContainer"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
  // 🔥 GANTI DENGAN CONFIG FIREBASE LO
  const firebaseConfig = {
    apiKey: "AIzaSyCJvzJoPflPeQC9Oj3GL1kVnqC3MX4mp28",
    authDomain: "grand-sehati-tv.firebaseapp.com",
    databaseURL: "https://grand-sehati-tv-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "grand-sehati-tv",
    storageBucket: "grand-sehati-tv.firebasestorage.app",
    messagingSenderId: "73111531904",
    appId: "1:73111531904:web:76250b137c416e716cd165"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const rooms = [
    ...Array.from({length: 19}, (_, i) => `Room ${i+1}`),
    "Wayan", "Made", "Nyoman", "Ketut"
  ];

  const container = document.getElementById("roomContainer");

  function createRoomUI(roomName) {
    const div = document.createElement("div");
    div.className = "room";
    div.id = `room-${roomName}`;

    div.innerHTML = `
      <h3>${roomName}</h3>
      <label>
        <input type="checkbox" name="${roomName}" value="box">
        Smart TV
      </label>
      <label>
        <input type="checkbox" name="${roomName}" value="normal">
        TV Biasa
      </label>
    `;

    const checkboxes = div.querySelectorAll("input");

    checkboxes.forEach(cb => {
      cb.addEventListener("change", () => {
        if (cb.checked) {
          // uncheck lainnya
          checkboxes.forEach(other => {
            if (other !== cb) other.checked = false;
          });

          saveData(roomName, cb.value);
        } else {
          // kalau di-uncheck semua → hapus data
          saveData(roomName, null);
        }
      });
    });

    container.appendChild(div);
  }

  function saveData(room, value) {
    const ref = db.ref("tv_rooms/" + room);

    if (value) {
      ref.set(value);
    } else {
      ref.remove();
    }
  }

  function applyUI(room, value) {
    const div = document.getElementById(`room-${room}`);
    if (!div) return;

    const checkboxes = div.querySelectorAll("input");

    checkboxes.forEach(cb => {
      cb.checked = (cb.value === value);
    });

    div.classList.remove("box-selected", "normal-selected");

    if (value === "box") {
      div.classList.add("box-selected");
    } else if (value === "normal") {
      div.classList.add("normal-selected");
    }
  }

  function init() {
    rooms.forEach(createRoomUI);

    // 🔥 REALTIME LISTENER
    db.ref("tv_rooms").on("value", snapshot => {
      const data = snapshot.val() || {};

      rooms.forEach(room => {
        applyUI(room, data[room]);
      });
    });
  }

  init();
</script>

</body>
</html>
